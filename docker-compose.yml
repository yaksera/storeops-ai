name: storeops

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://storeops:storeops@postgres:5432/storeops
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: development
  LOG_JSON: "false"
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  FRONTEND_ORIGIN: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops
      POSTGRES_DB: storeops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: *backend-env
    env_file: [{ path: .env, required: false }]
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: arq app.worker.main.WorkerSettings --watch app
    environment: *backend-env
    env_file: [{ path: .env, required: false }]
    volumes: [./backend:/app]
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ./frontend, target: dev }
    environment:
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  web_node_modules:
  web_next:
