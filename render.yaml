# Render Blueprint: API, workers, PostgreSQL and Redis-compatible Key Value.
# The Next.js frontend is deployed separately (e.g. Vercel); see docs/deployment.md.
databases:
  - name: storeops-db
    postgresMajorVersion: "16"
    plan: basic-256mb

services:
  - type: keyvalue
    name: storeops-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: storeops-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    envVars: &backend-env
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: storeops-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: storeops-redis, property: connectionString }
      - key: COOKIE_SECURE
        value: "true"
      - fromGroup: storeops-secrets

  - type: worker
    name: storeops-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: arq app.worker.main.WorkerSettings
    envVars: *backend-env

  - type: worker
    name: storeops-worker-priority
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: arq app.worker.main.WorkerSettings
    envVars:
      - key: WORKER_QUEUE
        value: storeops:priority
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: storeops-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: storeops-redis, property: connectionString }
      - key: COOKIE_SECURE
        value: "true"
      - fromGroup: storeops-secrets

# Fill this group in the Render dashboard with the values from .env.example: SECRET_KEY and
# TOKEN_ENCRYPTION_KEY (shared by the API and both workers: signed links and encrypted tokens
# must verify everywhere), FRONTEND_ORIGIN, CORS_ORIGINS, PUBLIC_APP_URL, SHOPIFY_API_KEY,
# SHOPIFY_API_SECRET, RESEND_API_KEY, EMAIL_FROM and optionally OPENROUTER_API_KEY, SENTRY_DSN,
# OTEL_EXPORTER_OTLP_ENDPOINT.
envVarGroups:
  - name: storeops-secrets
    envVars: []
